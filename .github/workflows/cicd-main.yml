name: CICD NeMo
on:
  schedule:
    - cron: 0 0 * * *
  push:
    branches:
      - main
      - "pull-request/[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || 'main' }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ephemeral-runner-routing:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_ephemeral_runner_routing.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a
    with:
      lane: ${{ vars.NEMO_CI_EPHEMERAL_LANE }}
      legacy_label: nemo-ci-aws-gpu-x2-ephemeral
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}

  pre-flight:
    needs: [ephemeral-runner-routing]
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_cicd_preflight.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a
    with:
      default_runner_prefix: nemo-ci-aws-gpu-x2
      non_nvidia_runner_prefix: ${{ needs.ephemeral-runner-routing.outputs.runner_label_base }}
      default_test_data_path: /mnt/datadrive/TestData/nemo-fw/TestData
      non_nvidia_test_data_path: /mnt/datadrive/TestData/nemo-fw/TestData
      default_registry: 766267172432.dkr.ecr.us-east-1.amazonaws.com
      non_nvidia_registry: 766267172432.dkr.ecr.us-east-1.amazonaws.com
      sso_users_filename: ${{ vars.SSO_USERS_FILENAME }}
    secrets:
      NVIDIA_MANAGEMENT_ORG_PAT: ${{ secrets.NVIDIA_MANAGEMENT_ORG_PAT }}

  cicd-wait-in-queue:
    needs: [pre-flight]
    runs-on: ubuntu-latest
    environment: test
    if: |
      !(needs.pre-flight.outputs.is_ci_workload == 'true'
      || needs.pre-flight.outputs.is_deployment_workflow == 'true'
      || needs.pre-flight.outputs.docs_only == 'true')
    steps:
      - name: Running CI tests
        run: |
          echo "Running CI tests"

  cicd-container-build:
    outputs:
      tested_sha: ${{ steps.revision.outputs.sha }}
      image_digest: ${{ steps.image.outputs.digest }}
    needs: [pre-flight, cicd-wait-in-queue]
    runs-on: ${{ startsWith(needs.pre-flight.outputs.runner_prefix, 'ephe-v2-') && format('{0}-a{1}', needs.pre-flight.outputs.runner_prefix, github.run_attempt) || needs.pre-flight.outputs.runner_prefix }}
    if: |
      (
        success()
        || needs.pre-flight.outputs.is_ci_workload == 'true'
        || needs.pre-flight.outputs.force_run_all == 'true'
      )
      && !cancelled()
    steps:
      - name: Install GH CLI
        shell: bash
        run: |
          for i in 1 2 3; do
            apt-get update && apt-get install -y gh && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Resolve tested revision
        id: revision
        shell: bash -e -u -o pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" =~ ^pull-request/([0-9]+)$ ]]; then
            pr_info=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${BASH_REMATCH[1]}" \
              --jq '.head.sha + " " + (.merge_commit_sha // "")')
            read -r pr_head sha <<< "$pr_info"
            if [[ "$pr_head" != "$GITHUB_SHA" || ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo '::error::PR merge revision is unavailable or the PR mirror is stale.'
              exit 1
            fi
            merge_head=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$sha" --jq '.parents[1].sha')
            if [[ "$merge_head" != "$GITHUB_SHA" ]]; then
              echo '::error::PR merge revision does not contain the pushed head.'
              exit 1
            fi
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Expected a full tested commit SHA.'
            exit 1
          fi
          echo "sha=$sha" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          ref: ${{ steps.revision.outputs.sha }}

      - name: Get last merged PR
        id: cache_from
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_PRS=$(gh api graphql -f query='
            query {
              repository(owner: "NVIDIA-NeMo", name: "Emerging-Optimizers") {
                pullRequests(states: MERGED, first: 100, orderBy: {field: UPDATED_AT, direction: DESC}) {
                  nodes {
                    number
                  }
                }
              }
            }' | jq -r '.data.repository.pullRequests.nodes[].number' | while read -r number; do
              echo "type=registry,ref=${{ needs.pre-flight.outputs.registry }}/emerging-optimizers:$number-buildcache,mode=max"
            done)

          echo "LAST_PRS<<EOF" | tee -a $GITHUB_OUTPUT
          echo "$LAST_PRS" | tee -a $GITHUB_OUTPUT
          echo "EOF" | tee -a $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute cache keys
        id: cache_keys
        shell: bash
        env:
          REGISTRY: ${{ needs.pre-flight.outputs.registry }}
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^pull-request/([0-9]+)$ ]]; then
            KEY="${BASH_REMATCH[1]}"
          else
            KEY=$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-' | tr -cd '[:alnum:]._-')
          fi
          echo "key=$KEY" | tee -a "$GITHUB_OUTPUT"
          echo "cache-to=type=registry,ref=$REGISTRY/emerging-optimizers:${KEY}-buildcache,mode=max" | tee -a "$GITHUB_OUTPUT"

      - name: Build and push
        id: image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          file: ./docker/Dockerfile.ci
          push: true
          provenance: false
          sbom: false
          context: .
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=${{ needs.pre-flight.outputs.registry }}/emerging-optimizers:${{ steps.cache_keys.outputs.key }}-buildcache,mode=max
            type=registry,ref=${{ needs.pre-flight.outputs.registry }}/emerging-optimizers:main-buildcache,mode=max
            ${{ steps.cache_from.outputs.LAST_PRS }}
          cache-to: ${{ steps.cache_keys.outputs.cache-to }}
          no-cache: false
          tags: |
            ${{ needs.pre-flight.outputs.registry }}/emerging-optimizers:${{ steps.cache_keys.outputs.key }}
            ${{ needs.pre-flight.outputs.registry }}/emerging-optimizers:${{ github.sha }}

  cicd-unit-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: L0_Tests_GPU
            runner: ${{ startsWith(needs.pre-flight.outputs.runner_prefix, 'ephe-v2-') && format('{0}-a{1}', needs.pre-flight.outputs.runner_prefix, github.run_attempt) || needs.pre-flight.outputs.runner_prefix }}
            timeout: 30
          - script: L0_Tests_CPU
            runner: ${{ startsWith(needs.pre-flight.outputs.runner_prefix, 'ephe-v2-') && format('{0}-a{1}', needs.pre-flight.outputs.runner_prefix, github.run_attempt) || needs.pre-flight.outputs.runner_prefix }}
            timeout: 30
            cpu-only: true
    needs: [pre-flight, cicd-container-build]
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.script }}
    if: ${{ !cancelled() && needs.cicd-container-build.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.cicd-container-build.outputs.tested_sha }}
      - name: main
        uses: ./.github/actions/test-template
        with:
          script: ${{ matrix.script }}
          timeout: ${{ matrix.timeout || 10 }}
          is_unit_test: "true"
          checkout-ref: ${{ needs.cicd-container-build.outputs.tested_sha }}
          container-image: ${{ needs.pre-flight.outputs.registry }}/emerging-optimizers@${{ needs.cicd-container-build.outputs.image_digest }}
          cpu-only: ${{ matrix.cpu-only || false }}
          test-data-path: ${{ needs.pre-flight.outputs.test_data_path }}
          runner: ${{ matrix.runner }}


      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results-${{ matrix.script }}
          path: test-results/**/*.xml
          if-no-files-found: ignore

  cicd-nightly-tests:
    needs: [pre-flight, cicd-container-build]
    runs-on: ${{ startsWith(needs.pre-flight.outputs.runner_prefix, 'ephe-v2-') && format('{0}-a{1}', needs.pre-flight.outputs.runner_prefix, github.run_attempt) || needs.pre-flight.outputs.runner_prefix }}
    name: L1_Tests_GPU
    if: ${{ !cancelled() && github.event_name == 'schedule' && needs.cicd-container-build.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.cicd-container-build.outputs.tested_sha }}
      - name: main
        uses: ./.github/actions/test-template
        with:
          script: L1_Tests_GPU
          timeout: 60
          is_unit_test: "true"
          checkout-ref: ${{ needs.cicd-container-build.outputs.tested_sha }}
          container-image: ${{ needs.pre-flight.outputs.registry }}/emerging-optimizers@${{ needs.cicd-container-build.outputs.image_digest }}
          runner: ${{ startsWith(needs.pre-flight.outputs.runner_prefix, 'ephe-v2-') && format('{0}-a{1}', needs.pre-flight.outputs.runner_prefix, github.run_attempt) || needs.pre-flight.outputs.runner_prefix }}
          test-data-path: ${{ needs.pre-flight.outputs.test_data_path }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results-L1_Tests_GPU
          path: test-results/**/*.xml
          if-no-files-found: ignore

  publish-test-results:
    needs: [cicd-unit-tests]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Download Test Results
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: test-results-L0_*
          merge-multiple: true

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        with:
          files: "**/*.xml"
          fail_on: "nothing"

  publish-nightly-test-results:
    needs: [cicd-nightly-tests]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Download Test Results
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: test-results-L1_*
          merge-multiple: true

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        with:
          files: "**/*.xml"
          fail_on: "nothing"
          check_name: "Nightly Test Results"

  Nemo_CICD_Test:
    needs:
      - pre-flight
      - cicd-container-build
      - cicd-unit-tests
    if: |
      (
        needs.pre-flight.outputs.docs_only == 'true'
        || needs.pre-flight.outputs.is_deployment_workflow == 'true'
        || needs.pre-flight.outputs.is_ci_workload == 'true'
        || always()
      )
      && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Get workflow result
        id: result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          DOCS_ONLY: ${{ needs.pre-flight.outputs.docs_only }}
          IS_DEPLOYMENT: ${{ needs.pre-flight.outputs.is_deployment_workflow }}
          IS_CI_WORKLOAD: ${{ needs.pre-flight.outputs.is_ci_workload }}
        run: |
          # Get workflow run details and check job conclusions
          NUM_FAILED=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs -q '[.jobs[] | select(.conclusion == "failure" and .name != "L1_Tests_GPU") | .name] | length')
          NUM_CANCELLED=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs -q '[.jobs[] | select(.conclusion == "cancelled" and .name != "L1_Tests_GPU") | .name] | length')

          if [[ ($NUM_FAILED -eq 0 && $NUM_CANCELLED -eq 0) || $DOCS_ONLY == 'true' || $IS_DEPLOYMENT == 'true' || $IS_CI_WORKLOAD == 'true' ]]; then
            RESULT="success"
          elif [[ $NUM_CANCELLED -gt 0 ]]; then
            RESULT="cancelled"
          else
            RESULT="failure"
          fi

          # Output the final status
          echo "code=$RESULT" | tee -a $GITHUB_OUTPUT

      - name: Exit
        if: ${{ always() }}
        env:
          RESULT: ${{ steps.result.outputs.code }}
        run: |
          if [ $RESULT == "success" ]; then
            exit 0
          else
            exit 1
          fi

  Coverage_Fake:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    needs: [Nemo_CICD_Test, pre-flight]
    if: |
      (
        needs.pre-flight.outputs.docs_only == 'true'
        || needs.pre-flight.outputs.is_deployment_workflow == 'true'
      )
      && needs.pre-flight.outputs.is_ci_workload == 'false'
      && !cancelled()
    steps:
      - name: Generate fake coverage report
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              description: 'No code changes - coverage check skipped',
              context: 'codecov/patch'
            });

  Coverage:
    runs-on: ubuntu-latest
    needs: [pre-flight, Nemo_CICD_Test]
    if: |
      (
        (needs.pre-flight.outputs.is_ci_workload == 'true' && !failure())
        || success()
      )
      && !cancelled()
    strategy:
      matrix:
        flag: [unit-test]
    steps:
      - name: Get PR info
        id: get-pr-info
        if: startsWith(github.ref, 'refs/heads/pull-request/')
        uses: nv-gha-runners/get-pr-info@090577647b8ddc4e06e809e264f7881650ecdccf # main

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download coverage reports of current branch
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: coverage-${{ matrix.flag }}-*

      - name: Get total coverage of current branch
        shell: bash -x -e -u -o pipefail {0}
        if: always()
        run: |
          pip install coverage

          ls -al .
          ls -al coverage-*/
          coverage combine --keep $(ls coverage-*/.coverage)
          coverage report -i
          rm -rf coverage-*
          ls -al

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: ${{ matrix.flag }}
          base_sha: ${{ fromJSON(steps.get-pr-info.outputs.pr-info || '{}').base.sha }}

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ matrix.flag }}-aggregated
          path: |
            .coverage
          include-hidden-files: true
